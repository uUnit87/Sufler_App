<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Суфлер</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #e9edf1;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { overscroll-behavior: none; }

  /* ---------- Экран настроек ---------- */
  #setup { max-width: 720px; margin: 0 auto; padding: 16px 16px 32px; min-height: 100%;
    display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 20px; margin: 4px 0 0; font-weight: 650; letter-spacing: .02em; }
  h1 small { font-weight: 400; color: #7d8894; font-size: 12px; margin-left: 6px; }
  textarea { width: 100%; min-height: 34vh; flex: 1; resize: vertical; padding: 12px;
    background: #14181d; color: #e9edf1; border: 1px solid #2a323b; border-radius: 12px;
    font: 16px/1.45 inherit; outline: none; }
  textarea:focus { border-color: #f2b632; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .card { background: #14181d; border: 1px solid #2a323b; border-radius: 12px; padding: 12px 14px; }
  .ctl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; }
  .ctl label { font-size: 14px; color: #aab4bf; }
  .ctl output { font-variant-numeric: tabular-nums; font-weight: 600; color: #f2b632; }
  .ctl input[type=range] { grid-column: 1 / -1; width: 100%; height: 34px; accent-color: #f2b632; }
  .ctl + .ctl { margin-top: 8px; }
  .checks { display: grid; gap: 10px; }
  .checks label { display: flex; align-items: center; gap: 10px; font-size: 15px; }
  .checks input { width: 22px; height: 22px; accent-color: #f2b632; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer;
    background: #232a32; color: #e9edf1; min-height: 48px; }
  button:active { transform: scale(.97); }
  button.primary { background: #f2b632; color: #14110a; font-weight: 700; font-size: 18px; flex: 1; }
  .meta { font-size: 13px; color: #7d8894; }
  #preview { margin-top: 10px; padding: 10px 12px; background: #000; border-radius: 8px; color: #fff;
    font-weight: 600; line-height: 1.3; overflow: hidden; white-space: nowrap; text-overflow: clip; }

  /* ---------- Экран суфлера ---------- */
  #prompter { position: fixed; inset: 0; background: #000; display: none; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  #prompter.on { display: block; }
  #flip { position: absolute; inset: 0; }
  #flip.mirror { transform: scaleX(-1); }
  #text { position: absolute; left: 0; right: 0; top: 0; padding: 0 5vw; color: #fff;
    font-weight: 600; line-height: 1.35; white-space: pre-wrap; overflow-wrap: break-word;
    will-change: transform; }
  #text .endmark { display: block; text-align: center; color: #555; margin-top: 1.5em; }
  .guide { position: absolute; top: 35%; width: 0; height: 0; pointer-events: none; opacity: .85;
    border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-top: -12px; }
  .guide.l { left: 0; border-left: 16px solid #f2b632; }
  .guide.r { right: 0; border-right: 16px solid #f2b632; }
  #count { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 40vmin; font-weight: 800; color: #f2b632; background: rgba(0,0,0,.6); }
  #count.on { display: flex; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    background: rgba(15,18,22,.92); display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    transition: transform .2s, opacity .2s; }
  #bar.hide { transform: translateY(110%); opacity: 0; pointer-events: none; }
  #bar button { min-width: 54px; padding: 10px 12px; font-size: 16px; }
  #bar .grp { display: flex; align-items: center; gap: 6px; background: #1a2027; border-radius: 12px; padding: 0 4px; }
  #bar .grp span { font-size: 13px; color: #aab4bf; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  #bar .grp button { background: transparent; min-width: 46px; font-size: 20px; }
  #bar #play { background: #f2b632; color: #14110a; font-weight: 700; min-width: 110px; }
  #hint { position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-size: 13px; color: #8a949f;
    pointer-events: none; transition: opacity .2s; }
  #hint.hide { opacity: 0; }
</style>
</head>
<body>

<div id="setup">
  <h1>Суфлер <small>v1.1</small></h1>
  <button id="install" style="display:none">Установить на главный экран</button>

  <textarea id="src" placeholder="Вставьте сюда текст..."></textarea>

  <div class="row">
    <button id="paste">Вставить из буфера</button>
    <button id="clear">Очистить</button>
    <span class="meta" id="stat" style="align-self:center"></span>
  </div>

  <div class="card">
    <div class="ctl">
      <label for="size">Размер текста</label><output id="sizeOut"></output>
      <input type="range" id="size" min="20" max="140" step="2">
    </div>
    <div class="ctl">
      <label for="speed">Скорость прокрутки</label><output id="speedOut"></output>
      <input type="range" id="speed" min="5" max="300" step="5">
    </div>
    <div id="preview">Пример размера текста</div>
  </div>

  <div class="card checks">
    <label><input type="checkbox" id="countdown"> Отсчет 3 секунды перед стартом</label>
    <label><input type="checkbox" id="mirror"> Зеркальный текст (для стекла суфлера)</label>
  </div>

  <div class="row">
    <button class="primary" id="start">▶ Старт</button>
  </div>
  <div class="meta">
    В режиме чтения: касание экрана - пауза / продолжить. Пальцем можно протянуть текст вверх или вниз.
    Текст и настройки сохраняются на телефоне.
  </div>
</div>

<div id="prompter">
  <div id="flip"><div id="text"></div></div>
  <div class="guide l"></div><div class="guide r"></div>
  <div id="hint">Касание - пауза</div>
  <div id="count"></div>
  <div id="bar">
    <button id="exit">✕</button>
    <button id="restart">⟲</button>
    <div class="grp"><button id="fMinus">−</button><span id="fLbl"></span><button id="fPlus">+</button></div>
    <div class="grp"><button id="sMinus">−</button><span id="sLbl"></span><button id="sPlus">+</button></div>
    <button id="play">▶ Пуск</button>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'sufler.v1';

  // ---------- Состояние ----------
  var st = { text: '', size: 56, speed: 60, countdown: true, mirror: false };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved) for (var k in st) if (k in saved) st[k] = saved[k];
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  var src = $('src'), size = $('size'), speed = $('speed');
  var prompter = $('prompter'), flip = $('flip'), text = $('text'), bar = $('bar'), hint = $('hint');

  // ---------- Экран настроек ----------
  function speedLabel(v) { return v + ' пикс/с'; }
  function syncSetup() {
    src.value = st.text; size.value = st.size; speed.value = st.speed;
    $('countdown').checked = st.countdown; $('mirror').checked = st.mirror;
    $('sizeOut').textContent = st.size + ' px';
    $('speedOut').textContent = speedLabel(st.speed);
    $('preview').style.fontSize = st.size + 'px';
    updateStat();
  }
  function updateStat() {
    var w = st.text.trim() ? st.text.trim().split(/\s+/).length : 0;
    $('stat').textContent = w ? w + ' слов' : '';
  }
  src.addEventListener('input', function () { st.text = src.value; updateStat(); save(); });
  size.addEventListener('input', function () { st.size = +size.value; syncSetup(); save(); });
  speed.addEventListener('input', function () { st.speed = +speed.value; syncSetup(); save(); });
  $('countdown').addEventListener('change', function (e) { st.countdown = e.target.checked; save(); });
  $('mirror').addEventListener('change', function (e) { st.mirror = e.target.checked; save(); });
  $('clear').addEventListener('click', function () {
    if (!st.text || confirm('Удалить весь текст?')) { st.text = ''; syncSetup(); save(); }
  });
  $('paste').addEventListener('click', function () {
    var fail = function () { src.focus(); alert('Не удалось прочитать буфер. Нажмите и удерживайте поле текста, затем "Вставить".'); };
    if (!navigator.clipboard || !navigator.clipboard.readText) return fail();
    navigator.clipboard.readText().then(function (t) {
      if (!t) return;
      st.text = st.text ? st.text + '\n' + t : t; syncSetup(); save();
    }).catch(fail);
  });

  // ---------- Не давать экрану гаснуть ----------
  var wakeLock = null, fbVideo = null, fbTimer = null;
  function keepAwake() {
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(fallbackAwake);
    } else fallbackAwake();
  }
  function fallbackAwake() {
    try {
      if (fbVideo) { fbVideo.play().catch(function () {}); return; }
      var c = document.createElement('canvas'); c.width = c.height = 2;
      var ctx = c.getContext('2d'), n = 0;
      fbTimer = setInterval(function () { ctx.fillStyle = (n++ % 2) ? '#000' : '#010101'; ctx.fillRect(0, 0, 2, 2); }, 500);
      fbVideo = document.createElement('video');
      fbVideo.muted = true; fbVideo.setAttribute('playsinline', '');
      fbVideo.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
      fbVideo.srcObject = c.captureStream(2);
      document.body.appendChild(fbVideo);
      fbVideo.play().catch(function () {});
    } catch (e) {}
  }
  function releaseAwake() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
    if (fbVideo) { try { fbVideo.pause(); fbVideo.remove(); } catch (e) {} fbVideo = null; }
    if (fbTimer) { clearInterval(fbTimer); fbTimer = null; }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && prompter.classList.contains('on')) keepAwake();
    if (document.visibilityState !== 'visible') pause();
  });

  // ---------- Суфлер ----------
  var pos = 0, playing = false, lastT = 0, raf = 0, countTimer = 0;
  var GUIDE = 0.35; // линия чтения - 35% высоты экрана

  function startOffset() { return prompter.clientHeight * GUIDE; }
  function maxPos() { return Math.max(0, text.scrollHeight - st.size * 1.35); }
  function render() {
    text.style.transform = 'translate3d(0,' + (startOffset() - pos).toFixed(2) + 'px,0)';
  }
  function labels() {
    $('fLbl').textContent = 'Размер ' + st.size;
    $('sLbl').textContent = 'Скор. ' + st.speed;
    $('play').textContent = playing ? '❚❚ Пауза' : '▶ Пуск';
  }
  function applyFont(newSize) {
    var ratio = maxPos() ? pos / maxPos() : 0;
    st.size = Math.min(140, Math.max(20, newSize));
    text.style.fontSize = st.size + 'px';
    pos = ratio * maxPos();
    render(); labels(); save();
  }
  function applySpeed(v) { st.speed = Math.min(300, Math.max(5, v)); labels(); save(); }

  function tick(t) {
    if (!playing) return;
    var dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
    pos += st.speed * dt;
    if (pos >= maxPos()) { pos = maxPos(); render(); pause(); return; }
    render();
    raf = requestAnimationFrame(tick);
  }
  function play() {
    if (playing) return;
    if (pos >= maxPos()) pos = 0;
    playing = true; lastT = performance.now();
    bar.classList.add('hide'); hint.classList.add('hide'); labels();
    raf = requestAnimationFrame(tick);
  }
  function pause() {
    clearInterval(countTimer); $('count').classList.remove('on');
    if (!prompter.classList.contains('on')) return;
    playing = false; cancelAnimationFrame(raf);
    bar.classList.remove('hide'); labels();
  }
  function countdownThenPlay() {
    if (!st.countdown) return play();
    var n = 3, c = $('count');
    bar.classList.add('hide');
    c.textContent = n; c.classList.add('on');
    countTimer = setInterval(function () {
      n--;
      if (n <= 0) { clearInterval(countTimer); c.classList.remove('on'); play(); }
      else c.textContent = n;
    }, 1000);
  }

  function open() {
    if (!st.text.trim()) { alert('Сначала вставьте текст.'); src.focus(); return; }
    text.textContent = st.text.replace(/\s+$/, '');
    var end = document.createElement('span'); end.className = 'endmark'; end.textContent = '• • •';
    text.appendChild(end);
    text.style.fontSize = st.size + 'px';
    flip.classList.toggle('mirror', st.mirror);
    prompter.classList.add('on');
    pos = 0; playing = false; render(); labels();
    hint.classList.remove('hide');
    try { var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    keepAwake();
    countdownThenPlay();
  }
  function close() {
    pause();
    prompter.classList.remove('on');
    releaseAwake();
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    syncSetup();
  }

  $('start').addEventListener('click', open);
  $('exit').addEventListener('click', close);
  $('restart').addEventListener('click', function () { pause(); pos = 0; render(); countdownThenPlay(); });
  $('play').addEventListener('click', function () { playing ? pause() : play(); });
  $('fMinus').addEventListener('click', function () { applyFont(st.size - 4); });
  $('fPlus').addEventListener('click', function () { applyFont(st.size + 4); });
  $('sMinus').addEventListener('click', function () { applySpeed(st.speed - 5); });
  $('sPlus').addEventListener('click', function () { applySpeed(st.speed + 5); });
  bar.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  window.addEventListener('resize', function () { if (prompter.classList.contains('on')) { pos = Math.min(pos, maxPos()); render(); } });

  // Касание - пауза/пуск, протяжка - ручная прокрутка
  var drag = null;
  prompter.addEventListener('pointerdown', function (e) {
    if ($('count').classList.contains('on')) { pause(); drag = null; return; }
    drag = { y: e.clientY, pos: pos, moved: false, wasPlaying: playing };
  });
  prompter.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dy) < 10) return;
    if (!drag.moved) { drag.moved = true; if (playing) { playing = false; cancelAnimationFrame(raf); } }
    pos = Math.min(maxPos(), Math.max(0, drag.pos - dy));
    render();
  });
  function endDrag() {
    if (!drag) return;
    var d = drag; drag = null;
    if (d.moved) { if (d.wasPlaying) { playing = false; play(); } }
    else { playing ? pause() : play(); }
  }
  prompter.addEventListener('pointerup', endDrag);
  prompter.addEventListener('pointercancel', function () { if (drag && drag.moved && drag.wasPlaying) { playing = false; play(); } drag = null; });

  // Кнопка "Назад" на Андроиде при полноэкранном режиме
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement && prompter.classList.contains('on') && playing) pause();
  });

  syncSetup();

  // ---------- PWA: офлайн и установка ----------
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  var deferred = null, inst = $('install');
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e; inst.style.display = 'block';
  });
  inst.addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.finally(function () { deferred = null; inst.style.display = 'none'; });
  });
  window.addEventListener('appinstalled', function () { inst.style.display = 'none'; });
})();
</script>
</body>
</html>
